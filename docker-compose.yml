services:
  db:
    image: postgres:16-alpine
    ports:
      - '${DB_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness
      POSTGRES_DB: fitness
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fitness -d fitness']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '${API_PORT:-3000}:3000'
    environment:
      # Inside compose the API reaches Postgres at db:5432 (ignores the host DATABASE_URL in .env).
      DATABASE_URL: postgresql://fitness:fitness@db:5432/fitness
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      THROTTLE_AUTH_LIMIT: ${THROTTLE_AUTH_LIMIT:-1000}
      THROTTLE_AUTH_TTL_SEC: ${THROTTLE_AUTH_TTL_SEC:-900}
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '${WEB_PORT:-3001}:3000'
    environment:
      API_INTERNAL_URL: http://api:3000
      ADMIN_HOST: ${ADMIN_HOST:-admin.localhost}
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      - api

volumes:
  pgdata:
