# Copy to /opt/fitness2/docker-compose.yml on the server.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "80:80"
      - "443:443"
    environment:
      WEB_HOST: ${WEB_HOST}
      ADMIN_HOST: ${ADMIN_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

  web:
    image: ghcr.io/${GHCR_OWNER}/fitness2-web:${TAG}
    restart: unless-stopped
    mem_limit: 256m
    environment:
      NODE_ENV: production
      ADMIN_HOST: ${ADMIN_HOST}
      API_INTERNAL_URL: http://api:3000

  api:
    image: ghcr.io/${GHCR_OWNER}/fitness2-api:${TAG}
    restart: unless-stopped
    mem_limit: 256m
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 256m
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    environment:
      POSTGRES_USER: fitness
      POSTGRES_DB: fitness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness -d fitness"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  caddy_data:
  caddy_config:
