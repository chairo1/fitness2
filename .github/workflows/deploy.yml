name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lower-case owner
        id: owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "lc=${OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/fitness2-api:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.lc }}/fitness2-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/fitness2-web:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.lc }}/fitness2-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONF
          Host deploy-target
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            ServerAliveInterval 15
          CONF
      - name: Copy deploy files (in place, keeps Caddyfile inode and .env)
        run: |
          ssh deploy-target 'mkdir -p /opt/fitness2/backups'
          ssh deploy-target 'cat > /opt/fitness2/Caddyfile' < deploy/Caddyfile
          ssh deploy-target 'cat > /opt/fitness2/docker-compose.yml.tmp && mv /opt/fitness2/docker-compose.yml.tmp /opt/fitness2/docker-compose.yml' < deploy/docker-compose.prod.yml
          ssh deploy-target 'cat > /opt/fitness2/deploy.sh.tmp && mv /opt/fitness2/deploy.sh.tmp /opt/fitness2/deploy.sh' < deploy/deploy.sh
          ssh deploy-target 'cat > /opt/fitness2/backup.sh.tmp && mv /opt/fitness2/backup.sh.tmp /opt/fitness2/backup.sh' < deploy/backup.sh
          ssh deploy-target 'chmod +x /opt/fitness2/deploy.sh /opt/fitness2/backup.sh'
      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          TAG: ${{ github.sha }}
        run: |
          # Client-side expansion of actor and sha is intended.
          # shellcheck disable=SC2029
          printf '%s' "$GHCR_TOKEN" | ssh deploy-target "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          # shellcheck disable=SC2029
          ssh deploy-target "/opt/fitness2/deploy.sh '$TAG'"
      - name: Docker logout on server
        if: always()
        run: ssh deploy-target 'docker logout ghcr.io' || true
