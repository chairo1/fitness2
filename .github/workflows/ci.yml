name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fitness
          POSTGRES_PASSWORD: fitness
          POSTGRES_DB: fitness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fitness:fitness@localhost:5432/fitness
      JWT_SECRET: ci-secret
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create .env for package scripts
        run: |
          printf 'DATABASE_URL=%s\nJWT_SECRET=%s\nCOOKIE_SECURE=%s\n' \
            "$DATABASE_URL" "$JWT_SECRET" "$COOKIE_SECURE" > .env
      - run: pnpm --filter @fit/db migrate:deploy
      - run: pnpm turbo run lint typecheck test
      - run: pnpm --filter api test:e2e
      - name: Validate Caddyfile
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e WEB_HOST=a.test -e ADMIN_HOST=b.test \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
